<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console — Minassa Dirasa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --black: #0a0a0a;
        --white: #fafaf8;
        --rule: #d8d8d4;
        --muted: #8c8c88;
        --serif: "Cormorant Garamond", Georgia, serif;
        --mono: "Space Mono", "Courier New", monospace;
      }

      html,
      body {
        min-height: 100%;
        background: var(--white);
        color: var(--black);
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
      }

      /* ──────────────────────────────────────────
       GATE
    ────────────────────────────────────────── */
      #gate {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--white);
        z-index: 999;
        gap: 0;
      }

      .gate-kicker {
        font-family: var(--mono);
        font-size: 0.58rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 28px;
      }

      .gate-logo {
        font-size: 2.8rem;
        font-weight: 300;
        letter-spacing: -0.03em;
        line-height: 1;
        text-align: center;
        margin-bottom: 6px;
      }

      .gate-sub {
        font-size: 1rem;
        font-style: italic;
        font-weight: 300;
        color: var(--muted);
        margin-bottom: 56px;
        letter-spacing: 0.04em;
      }

      .gate-rule {
        width: 48px;
        height: 1px;
        background: var(--rule);
        margin-bottom: 40px;
      }

      .gate-input {
        width: 240px;
        background: transparent;
        border: none;
        border-bottom: 1.5px solid var(--black);
        font-family: var(--mono);
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-align: center;
        padding: 8px 0;
        color: var(--black);
        outline: none;
        transition: border-color 0.2s;
      }
      .gate-input::placeholder {
        color: var(--muted);
        font-style: italic;
        letter-spacing: 0.06em;
      }
      .gate-input.shake {
        animation: shake 0.35s ease;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }

      .gate-hint {
        font-family: var(--mono);
        font-size: 0.58rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: transparent;
        margin-top: 18px;
        transition: color 0.3s;
      }
      .gate-hint.show {
        color: var(--black);
      }

      /* ──────────────────────────────────────────
       APP SHELL
    ────────────────────────────────────────── */
      #app {
        display: none;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── Masthead ── */
      .masthead {
        position: sticky;
        top: 0;
        background: var(--white);
        z-index: 100;
        border-bottom: 1.5px solid var(--black);
      }

      .masthead-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 48px;
        border-bottom: 1px solid var(--rule);
      }

      .masthead-brand {
        font-family: var(--mono);
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .masthead-date {
        font-family: var(--mono);
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .btn-exit {
        background: none;
        border: none;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 0.58rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        transition: color 0.18s;
        padding: 0;
      }
      .btn-exit:hover {
        color: var(--black);
      }

      .masthead-title-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 20px 48px 18px;
      }

      .masthead-title {
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1;
      }

      .masthead-actions {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .stat-chip {
        font-family: var(--mono);
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .stat-chip strong {
        font-size: 0.95rem;
        vertical-align: middle;
      }

      .btn-mark {
        background: var(--black);
        color: var(--white);
        border: none;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 0.58rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        padding: 8px 16px;
        transition: opacity 0.18s;
      }
      .btn-mark:hover {
        opacity: 0.75;
      }

      /* ── Message List ── */
      .feed {
        max-width: 780px;
        width: 100%;
        margin: 0 auto;
        padding: 0 48px 100px;
      }

      .msg {
        border-bottom: 1px solid var(--rule);
        padding: 26px 0;
        cursor: pointer;
        transition: padding-left 0.2s ease;
        position: relative;
      }
      .msg:first-child {
        border-top: 1px solid var(--rule);
      }
      .msg:hover {
        padding-left: 10px;
      }

      .msg-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 13px;
      }

      .msg-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--black);
        flex-shrink: 0;
        transition: all 0.25s;
      }
      .msg-dot.read {
        background: transparent;
        border: 1.5px solid var(--muted);
      }

      .msg-status {
        font-family: var(--mono);
        font-size: 0.55rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        border: 1px solid var(--black);
        padding: 2px 8px;
        color: var(--black);
        transition: all 0.25s;
      }
      .msg-status.read {
        border-color: var(--rule);
        color: var(--muted);
      }

      .msg-time {
        font-family: var(--mono);
        font-size: 0.6rem;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .msg-del {
        margin-left: auto;
        background: none;
        border: none;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--rule);
        padding: 4px 6px;
        transition: color 0.18s;
        line-height: 1;
      }
      .msg-del:hover {
        color: var(--black);
      }

      .msg-body {
        font-size: 1.08rem;
        font-style: italic;
        font-weight: 300;
        line-height: 1.75;
        color: var(--black);
        padding-left: 19px;
        direction: rtl;
        text-align: right;
      }
      .msg.unread .msg-body {
        font-weight: 400;
      }

      /* ── Empty & Loading ── */
      .state-center {
        text-align: center;
        padding: 80px 40px;
        color: var(--muted);
      }
      .state-center h2 {
        font-size: 2rem;
        font-weight: 300;
        font-style: italic;
        margin-bottom: 10px;
      }
      .state-center p {
        font-family: var(--mono);
        font-size: 0.6rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      /* ── New message ping ── */
      #ping {
        position: fixed;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%) translateY(72px);
        background: var(--black);
        color: var(--white);
        font-family: var(--mono);
        font-size: 0.6rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        padding: 11px 22px;
        cursor: pointer;
        opacity: 0;
        transition:
          transform 0.42s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.42s;
        white-space: nowrap;
        border: none;
      }
      #ping.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      @media (max-width: 640px) {
        .masthead-top,
        .masthead-title-row,
        .feed {
          padding-left: 20px;
          padding-right: 20px;
        }
        .masthead-date {
          display: none;
        }
        .masthead-title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- ── GATE ──────────────────────────────────── -->
    <div id="gate">
      <p class="gate-kicker">Minassa Dirasa</p>
      <h1 class="gate-logo">Admin<br />Console</h1>
      <p class="gate-sub">منصة دراسة</p>
      <div class="gate-rule"></div>
      <input
        id="gate-input"
        class="gate-input"
        type="password"
        placeholder="access key"
        autocomplete="off"
      />
      <p class="gate-hint" id="gate-hint">Incorrect key — try again</p>
    </div>

    <!-- ── APP ───────────────────────────────────── -->
    <div id="app">
      <header class="masthead">
        <div class="masthead-top">
          <span class="masthead-brand">Minassa Dirasa</span>
          <span class="masthead-date" id="today-date"></span>
          <button class="btn-exit" onclick="logout()">Exit ↗</button>
        </div>
        <div class="masthead-title-row">
          <h1 class="masthead-title">Feedback Console</h1>
          <div class="masthead-actions">
            <span class="stat-chip"
              ><strong id="stat-unread">—</strong> unread</span
            >
            <span class="stat-chip"
              ><strong id="stat-total">—</strong> total</span
            >
            <button class="btn-mark" onclick="markAllRead()">
              Mark all read
            </button>
          </div>
        </div>
      </header>

      <div class="feed" id="feed">
        <div class="state-center"><p>Loading…</p></div>
      </div>
    </div>

    <!-- ── NEW MESSAGE PING ───────────────────────── -->
    <button id="ping" onclick="refreshMessages()">
      ↑ New message — tap to refresh
    </button>

    <script>
      const { createClient } = supabase;
      const db = createClient(
        "https://zlffllggwhvxgevzpmvc.supabase.co",
        "sb_publishable_hM_Xf0eBAz47rdUYnhTXbA_z8yeLvbV",
      );
      const ADMIN_PASS = "mohamed123456789mohamed-amine";

      document.getElementById("today-date").textContent =
        new Date().toLocaleDateString("en-GB", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });

      const gateEl = document.getElementById("gate");
      const appEl = document.getElementById("app");
      const inputEl = document.getElementById("gate-input");
      const hintEl = document.getElementById("gate-hint");
      const SK = "md_adm";

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") tryLogin();
        hintEl.classList.remove("show");
      });

      function tryLogin() {
        if (inputEl.value === ADMIN_PASS) {
          sessionStorage.setItem(SK, "1");
          gateEl.style.display = "none";
          appEl.style.display = "flex";
          appEl.style.flexDirection = "column";
          init();
        } else {
          inputEl.value = "";
          hintEl.classList.add("show");
          inputEl.classList.remove("shake");
          void inputEl.offsetWidth;
          inputEl.classList.add("shake");
        }
      }

      function logout() {
        sessionStorage.removeItem(SK);
        location.reload();
      }

      if (sessionStorage.getItem(SK) === "1") {
        gateEl.style.display = "none";
        appEl.style.display = "flex";
        appEl.style.flexDirection = "column";
        init();
      }

      let msgs = [];
      let lastCount = 0;

      async function init() {
        await loadMessages();
        startPolling();
      }

      async function loadMessages() {
        const { data, error } = await db
          .from("messages")
          .select("*")
          .order("created_at", { ascending: false });
        if (error) {
          console.error(error);
          document.getElementById("feed").innerHTML = `
        <div class="state-center">
          <h2>خطأ في الاتصال</h2>
          <p style="margin-top:12px;font-size:.75rem;color:#c00">${error.message}</p>
          <p style="margin-top:8px">تأكد أنك شغّلت SQL في Supabase</p>
        </div>`;
          return;
        }
        msgs = data || [];
        lastCount = msgs.length;
        render();
        updateStats();
      }

      async function refreshMessages() {
        hidePing();
        await loadMessages();
      }

      function render() {
        const feed = document.getElementById("feed");
        if (!msgs.length) {
          feed.innerHTML = `<div class="state-center"><h2>No messages yet.</h2><p>Waiting for feedback</p></div>`;
          return;
        }
        feed.innerHTML = msgs
          .map(
            (m) => `
      <div class="msg ${m.is_read ? "" : "unread"}" onclick="toggleRead('${m.id}',${m.is_read})">
        <div class="msg-header">
          <span class="msg-dot ${m.is_read ? "read" : ""}"></span>
          <span class="msg-status ${m.is_read ? "read" : ""}">${m.is_read ? "Read" : "New"}</span>
          <span class="msg-time">${fmtTime(m.created_at)}</span>
          <button class="msg-del" onclick="delMsg(event,'${m.id}')">✕</button>
        </div>
        <p class="msg-body">${esc(m.content)}</p>
      </div>`,
          )
          .join("");
      }

      function updateStats() {
        document.getElementById("stat-total").textContent = msgs.length;
        document.getElementById("stat-unread").textContent = msgs.filter(
          (m) => !m.is_read,
        ).length;
      }

      async function toggleRead(id, isRead) {
        await db.from("messages").update({ is_read: !isRead }).eq("id", id);
        const m = msgs.find((m) => m.id === id);
        if (m) m.is_read = !isRead;
        render();
        updateStats();
      }

      async function delMsg(e, id) {
        e.stopPropagation();
        if (!confirm("Delete this message?")) return;
        await db.from("messages").delete().eq("id", id);
        msgs = msgs.filter((m) => m.id !== id);
        render();
        updateStats();
      }

      async function markAllRead() {
        await db
          .from("messages")
          .update({ is_read: true })
          .eq("is_read", false);
        msgs.forEach((m) => (m.is_read = true));
        render();
        updateStats();
      }

      function startPolling() {
        setInterval(async () => {
          const { data } = await db.from("messages").select("id");
          if (data && data.length > lastCount) showPing();
        }, 15000);
      }

      function showPing() {
        document.getElementById("ping").classList.add("show");
      }
      function hidePing() {
        document.getElementById("ping").classList.remove("show");
      }

      function fmtTime(iso) {
        const d = new Date(iso),
          now = new Date();
        const min = Math.floor((now - d) / 60000);
        if (min < 1) return "Just now";
        if (min < 60) return `${min}m ago`;
        if (min < 1440) return `${Math.floor(min / 60)}h ago`;
        return (
          d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) +
          " · " +
          d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })
        );
      }

      function esc(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
    </script>
  </body>
</html>
