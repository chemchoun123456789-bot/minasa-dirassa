<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أكمل بياناتك | منصة دراسة</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Readex+Pro:wght@160;300;400;500;600;700&family=Tajawal:wght@300;400;500;700;900&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/assets/icon.jpg" />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      /* هاذ الملف بس باش يضمن نفس تموضع الكارد وقت ما ما تكونش
         gs-overlay/gs-shell classes مربوطة بأي نافذة/oversay ثانية —
         نفس القيم بالضبط المستعملة فـ index.html */
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      #gsPage {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 72px 16px 64px;
        box-sizing: border-box;
      }

      /* ══ Auth Gate — نفس شاشة التحميل المستعملة فـ index.html بالضبط ══ */
      #authGateOverlay {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lds-spinner {
        color: official;
        display: inline-block;
        position: relative;
        width: 80px;
        height: 80px;
      }
      .lds-spinner div {
        transform-origin: 40px 40px;
        animation: lds-spinner 1.2s linear infinite;
      }
      .lds-spinner div:after {
        content: " ";
        display: block;
        position: absolute;
        top: 3px;
        left: 37px;
        width: 6px;
        height: 18px;
        border-radius: 20%;
        background: #fff;
      }
      .lds-spinner div:nth-child(1) {
        transform: rotate(0deg);
        animation-delay: -1.1s;
      }
      .lds-spinner div:nth-child(2) {
        transform: rotate(30deg);
        animation-delay: -1s;
      }
      .lds-spinner div:nth-child(3) {
        transform: rotate(60deg);
        animation-delay: -0.9s;
      }
      .lds-spinner div:nth-child(4) {
        transform: rotate(90deg);
        animation-delay: -0.8s;
      }
      .lds-spinner div:nth-child(5) {
        transform: rotate(120deg);
        animation-delay: -0.7s;
      }
      .lds-spinner div:nth-child(6) {
        transform: rotate(150deg);
        animation-delay: -0.6s;
      }
      .lds-spinner div:nth-child(7) {
        transform: rotate(180deg);
        animation-delay: -0.5s;
      }
      .lds-spinner div:nth-child(8) {
        transform: rotate(210deg);
        animation-delay: -0.4s;
      }
      .lds-spinner div:nth-child(9) {
        transform: rotate(240deg);
        animation-delay: -0.3s;
      }
      .lds-spinner div:nth-child(10) {
        transform: rotate(270deg);
        animation-delay: -0.2s;
      }
      .lds-spinner div:nth-child(11) {
        transform: rotate(300deg);
        animation-delay: -0.1s;
      }
      .lds-spinner div:nth-child(12) {
        transform: rotate(330deg);
        animation-delay: 0s;
      }
      @keyframes lds-spinner {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="authGateOverlay">
      <div class="lds-spinner"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
    </div>
    <!-- ══ نفس الخلفية الحقيقية للموقع بالضبط — نسخة طبق الأصل، بلا أي تعديل ══ -->
    <canvas
      id="starsCanvas"
      aria-hidden="true"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
      "
    ></canvas>
    <canvas
      id="pixelBg"
      aria-hidden="true"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
        display: none;
      "
    ></canvas>

    <!-- ══ التنبيهات (toast) — لازم تبقى شغالة لرسائل الخطأ/النجاح ══ -->
    <div id="toast"></div>

    <!-- ══ فورم إكمال بيانات Google — نفس التصميم بالضبط ══ -->
    <div id="gsPage" style="display: none">
      <div class="card gs-shell" style="padding: 40px 36px; max-width: 460px; width: 92%">
        <div style="text-align: center; margin-bottom: 28px">
          <div class="gs-icon-badge">
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
          </div>
          <h2
            class="gs-title"
            style="
              font-family: &quot;Cairo&quot;, sans-serif;
              font-size: 22px;
              font-weight: 700;
              margin-bottom: 8px;
            "
          >
            مرحباً! أكمل بياناتك
          </h2>
          <p
            class="gs-subtitle"
            style="color: var(--muted); font-size: 14px; line-height: 1.6"
          >
            تم التحقق من حسابك بـ Google.<br />أضف بياناتك لإتمام إنشاء ملفك
            الشخصي.
          </p>
        </div>
        <div class="gs-rule"></div>
        <div style="display: flex; flex-direction: column; gap: 14px">
          <div>
            <label
              style="
                font-size: 12px;
                color: var(--muted);
                font-weight: 600;
                display: block;
                margin-bottom: 6px;
              "
              >اسمك الكامل</label
            >
            <input
              class="inp"
              type="text"
              id="gsName"
              placeholder="أدخل اسمك الكامل"
              autocomplete="name"
              maxlength="80"
            />
          </div>
          <div>
            <label
              style="
                font-size: 12px;
                color: var(--muted);
                font-weight: 600;
                display: block;
                margin-bottom: 6px;
              "
              >اسم مدرستك / جامعتك</label
            >
            <input
              class="inp"
              type="text"
              id="gsSchool"
              placeholder="اسم المدرسة أو الجامعة"
              maxlength="120"
            />
          </div>
          <div>
            <label
              style="
                font-size: 12px;
                color: var(--muted);
                font-weight: 600;
                display: block;
                margin-bottom: 6px;
              "
              >كلمة سر خاصة بالموقع</label
            >
            <div class="pw-wrap">
              <input
                class="inp"
                type="password"
                id="gsPass"
                placeholder="كلمة مرور خاصة بمنصة دراسة (8+ أحرف)"
                maxlength="128"
                oninput="gsCheckPassword(this.value)"
                onkeydown="if (event.key === 'Enter') submitGoogleProfile();"
              />
              <button type="button" class="pw-toggle"
                      onclick="togglePassVis('gsPass', this)"
                      tabindex="-1"
                      aria-label="إظهار/إخفاء كلمة المرور">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="strength-bar" style="margin-top: 6px">
              <div class="strength-seg" id="gs1"></div>
              <div class="strength-seg" id="gs2"></div>
              <div class="strength-seg" id="gs3"></div>
              <div class="strength-seg" id="gs4"></div>
            </div>
            <p
              id="gsStrengthLabel"
              style="font-size: 11px; color: var(--muted); margin-top: 4px"
            ></p>
            <p
              style="
                font-size: 11px;
                color: var(--muted);
                margin-top: 6px;
                line-height: 1.5;
              "
            >
              💡 هذه كلمة مرور خاصة بمنصة دراسة فقط، ولا علاقة لها بكلمة
              مرور حساب Google الخاص بك
            </p>
          </div>
          <button
            class="btn btn-primary"
            id="gsSubmitBtn"
            style="width: 100%; margin-top: 6px"
            onclick="submitGoogleProfile()"
          >
            إتمام التسجيل والدخول
          </button>
          <button
            onclick="cancelGoogleSetup()"
            style="
              background: none;
              border: none;
              color: var(--muted);
              font-size: 13px;
              cursor: pointer;
              font-family: &quot;Tajawal&quot;, sans-serif;
              padding: 6px;
              transition: color 0.2s;
            "
            onmouseover="this.style.color = 'white'"
            onmouseout="this.style.color = 'var(--muted)'"
          >
            إلغاء وتسجيل الخروج
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/js/google-setup.js"></script>
  </body>
</html>
